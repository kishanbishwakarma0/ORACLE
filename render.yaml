services:
  - type: web
    name: oracle-api
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: OMP_NUM_THREADS
        value: "1"

      - key: MKL_NUM_THREADS
        value: "1"